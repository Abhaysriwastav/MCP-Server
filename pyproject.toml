[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "video-automation-mcp"
version = "0.1.0"
description = "Production-ready MCP server for video editing automation with mixed sources, human-in-the-loop approval, and dual-format/structured publishing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34.0"]
youtube = ["yt-dlp>=2024.12.0"]
captions = ["faster-whisper>=1.1.0", "Pillow>=10.0.0"]
vision = ["opencv-python-headless>=4.9.0,<5"]
voice = ["omnivoice>=0.1.0", "coqui-tts>=0.24.0"]
full = [
    "boto3>=1.34.0",
    "yt-dlp>=2024.12.0",
    "faster-whisper>=1.1.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.9.0,<5",
    "omnivoice>=0.1.0",
    "coqui-tts>=0.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
video-automation-mcp = "video_mcp.server:main"
video-automation-dashboard = "video_mcp.dashboard.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

