services:
  dashboard:
    build: .
    container_name: video-mcp-dashboard
    command: ["video-automation-dashboard"]
    ports:
      - "8080:8080"
    environment:
      VIDEO_MCP_WORKSPACE_DIR: /app/workspace
      VIDEO_MCP_DB_PATH: /app/workspace/video_mcp.db
      VIDEO_MCP_RELEASE_DIR: /app/workspace/releases
      VIDEO_MCP_ALLOWED_LOCAL_ROOTS: /app/workspace
      VIDEO_MCP_DASHBOARD_HOST: 0.0.0.0
      VIDEO_MCP_DASHBOARD_PORT: "8080"
      VIDEO_MCP_WHISPER_DEVICE: auto
      VIDEO_MCP_WHISPER_COMPUTE_TYPE: auto
      VIDEO_MCP_OMNIVOICE_DEVICE: auto
      VIDEO_MCP_FFMPEG_HWACCEL: auto
      VIDEO_MCP_FFMPEG_TIMEOUT_SEC: "7200"
      VIDEO_MCP_MAX_DOWNLOAD_MB: "4096"
      VIDEO_MCP_DOWNLOAD_TIMEOUT_SEC: "600"
      VIDEO_MCP_YOUTUBE_MAX_COMMENTS: "80"
      HF_HOME: /app/workspace/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped

  mcp:
    build: .
    container_name: video-mcp-server
    command: ["video-automation-mcp"]
    ports:
      - "8000:8000"
    environment:
      VIDEO_MCP_WORKSPACE_DIR: /app/workspace
      VIDEO_MCP_DB_PATH: /app/workspace/video_mcp.db
      VIDEO_MCP_RELEASE_DIR: /app/workspace/releases
      VIDEO_MCP_ALLOWED_LOCAL_ROOTS: /app/workspace
      VIDEO_MCP_TRANSPORT: streamable-http
      VIDEO_MCP_HOST: 0.0.0.0
      VIDEO_MCP_PORT: "8000"
      VIDEO_MCP_WHISPER_DEVICE: auto
      VIDEO_MCP_WHISPER_COMPUTE_TYPE: auto
      VIDEO_MCP_OMNIVOICE_DEVICE: auto
      VIDEO_MCP_FFMPEG_HWACCEL: auto
      VIDEO_MCP_FFMPEG_TIMEOUT_SEC: "7200"
      VIDEO_MCP_MAX_DOWNLOAD_MB: "4096"
      VIDEO_MCP_DOWNLOAD_TIMEOUT_SEC: "600"
      VIDEO_MCP_YOUTUBE_MAX_COMMENTS: "80"
      HF_HOME: /app/workspace/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped
